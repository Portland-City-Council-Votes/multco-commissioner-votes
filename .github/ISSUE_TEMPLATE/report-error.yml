name: Report an error or missing vote
description: Something on the site is wrong, missing, or out of date.
title: "Report: "
labels: ["data-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep this accurate. Reports are public on GitHub. A link to an official source (a Board agenda, minutes or document on multnomah.granicus.com or multco.us) makes a fix much faster.
  - type: dropdown
    id: problem
    attributes:
      label: What's wrong?
      options:
        - A commissioner's vote is wrong
        - A vote is missing
        - The summary or theme is wrong or misleading
        - A news link is wrong or broken
        - A budget figure is wrong
        - Something else
    validations:
      required: true
  - type: input
    id: vote
    attributes:
      label: Which vote?
      description: Date, agenda item (like R.3) and title, if it's about a specific vote.
      placeholder: "2026-06-04 · R.5 · Resolution Adopting the Fiscal Year 2027 Budget..."
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong, and what should it say instead?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (optional)
      description: A link that shows the correct information.
      placeholder: https://multnomah.granicus.com/...
